workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - notify

java-compile:
  stage: validate
  image: eclipse-temurin:17-jdk
  timeout: 15m
  interruptible: true
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key:
      files:
        - pom.xml
        - .mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw --batch-mode --no-transfer-progress -DskipTests clean verify

node-package-check:
  stage: validate
  image: node:22-bookworm
  timeout: 10m
  interruptible: true
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci

dependency-audit:
  stage: validate
  image: node:22-bookworm
  timeout: 10m
  interruptible: true
  script:
    - npm audit --audit-level=high
  allow_failure: true

telegram-success:
  stage: notify
  image: python:3.12-slim
  timeout: 2m
  when: on_success
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "SUCCESS"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_success
    - when: never
  allow_failure: true

telegram-failure:
  stage: notify
  image: python:3.12-slim
  timeout: 2m
  when: on_failure
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "FAILED"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_failure
    - when: never
  allow_failure: true
